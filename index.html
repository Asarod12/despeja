<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despeja</title>
<meta name="description" content="Organiza y limpia tus correos de Gmail y Hotmail desde un solo lugar.">
<meta name="theme-color" content="#F0F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Despeja">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: mesa de clasificación — una columna de 760px máx., barra de pestañas fija abajo,
   hojas que suben desde abajo (remitente, correo, revisión). Acento: marcador amarillo sobre tinta. */
:root{
  --bg:#F0F1EE; --surface:#FFFFFF; --sunken:#E6E8E4; --ink:#15181B; --muted:#5C6369; --line:#D9DCD6;
  --hi:#FFD23F; --hi-ink:#1C1800; --hi-soft:#FFF4C4;
  --danger:#C2362D; --danger-soft:#FBE3E0; --warn:#8F5E00; --warn-soft:#FFEFCB; --ok:#21734A; --ok-soft:#DCF1E4;
  --t-promo:#E06F35; --t-news:#C39421; --t-social:#5675D2; --t-notif:#97A0A9; --t-seg:#A646B8;
  --t-compra:#16968A; --t-fin:#3F8B37; --t-acad:#CF4475; --t-pers:#2B3D8C; --t-otro:#C4C9CE;
  --shadow:0 1px 0 rgba(20,24,27,.04), 0 6px 24px rgba(20,24,27,.07);
  --f-display:'Archivo','Arial Narrow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D20; --sunken:#23272B; --ink:#ECEEEF; --muted:#9BA2A9; --line:#2C3136;
  --hi:#FFD23F; --hi-ink:#1C1800; --hi-soft:#3A3212;
  --danger:#FF6E62; --danger-soft:#3B1D1A; --warn:#F0B54A; --warn-soft:#382A10; --ok:#55C98D; --ok-soft:#163525;
  --t-promo:#F08550; --t-news:#D9AE3D; --t-social:#7A95E8; --t-notif:#7E8892; --t-seg:#C474D4;
  --t-compra:#33B5A8; --t-fin:#66B35C; --t-acad:#E66B96; --t-pers:#8FA2F0; --t-otro:#4E555C;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --sunken:#23272B; --ink:#ECEEEF; --muted:#9BA2A9; --line:#2C3136;
  --hi:#FFD23F; --hi-ink:#1C1800; --hi-soft:#3A3212;
  --danger:#FF6E62; --danger-soft:#3B1D1A; --warn:#F0B54A; --warn-soft:#382A10; --ok:#55C98D; --ok-soft:#163525;
  --t-promo:#F08550; --t-news:#D9AE3D; --t-social:#7A95E8; --t-notif:#7E8892; --t-seg:#C474D4;
  --t-compra:#33B5A8; --t-fin:#66B35C; --t-acad:#E66B96; --t-pers:#8FA2F0; --t-otro:#4E555C;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35); color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
a{color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}

.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 96px)}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:22px;letter-spacing:-.02em}
.wordmark .mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center;position:relative;overflow:hidden}
.wordmark .mark::before{content:"";position:absolute;left:5px;right:5px;top:9px;height:13px;border:2px solid var(--bg);border-radius:3px}
.wordmark .mark::after{content:"";position:absolute;left:3px;right:3px;top:17px;height:6px;background:var(--hi);transform:rotate(-8deg);border-radius:2px}
.acct-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.achip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px 3px 4px;font-size:12px;max-width:180px;min-width:0}
.achip b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-family:var(--f-mono);color:#fff;flex:none}
.achip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.achip.exp{border-color:var(--warn);color:var(--warn)}
.pv-google{background:#D2473A}.pv-microsoft{background:#1E6BD6}.pv-demo{background:#6B7280}
.progress{height:4px;border-radius:4px;background:var(--sunken);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .2s}
.status-line{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--hi-soft);font-size:13px}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner .grow{flex:1;min-width:0}
.banner button{flex:none}

/* Tipografía de vista */
h1,h2,h3{margin:0;font-family:var(--f-display);font-stretch:112%;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:28px;font-weight:800;line-height:1.08}
h2{font-size:19px;font-weight:750}
h3{font-size:16px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:700;font-size:14px;min-height:40px;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.hi{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:8px}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* Tarjetas */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}

/* Resumen */
.hero{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.hero .big{font-family:var(--f-display);font-stretch:125%;font-weight:850;font-size:44px;line-height:1;letter-spacing:-.03em}
.hero .sub{color:var(--muted)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--sunken)}
.stack span{display:block;min-width:3px}
.stack.thin{height:6px;border-radius:3px;gap:1px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.legend .num{flex:none}
.legend .lbl{flex:1;min-width:0;line-height:1.25}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

.sugg{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.sugg .count{grid-row:span 2;font-family:var(--f-display);font-stretch:125%;font-weight:850;font-size:30px;line-height:1;min-width:64px;text-align:right}
.sugg .t{font-weight:700}
.sugg .d{font-size:13px;color:var(--muted)}
.sugg .row-btns{grid-column:2;margin-top:8px}
.sugg-list{display:flex;flex-direction:column;gap:10px}

/* Listas */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:color-mix(in srgb,var(--sunken) 50%,transparent)}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;color:#fff;flex:none}
.item .main{min-width:0;display:flex;flex-direction:column;gap:5px}
.item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .right{text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.item .right .num{font-size:17px;font-weight:600}
.more{padding:12px;text-align:center}

.msg{grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
.msg .subj{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.unread .subj::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:2px}
.msg .snip{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg .from{font-size:13px;display:flex;gap:6px;align-items:center;min-width:0}
.msg .from span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:2px;background:var(--surface)}
.check.on{background:var(--ink);border-color:var(--ink)}
.check.on::after{content:"";width:10px;height:5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}

/* Etiquetas de tipo / importancia */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--sunken);white-space:nowrap;font-weight:700}
.tag.alta{background:var(--danger-soft);color:var(--danger)}
.tag.media{background:var(--warn-soft);color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:5px}

/* Chips de opciones */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;min-height:36px;text-align:left}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .dot{box-shadow:0 0 0 2px var(--bg)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;min-height:42px;font-size:16px}
.input.mono{font-family:var(--f-mono);font-size:13px}
.search{position:relative}
.search .input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:180px}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px;width:auto}
.toggle{display:flex;align-items:center;gap:10px;justify-content:space-between;border:0;background:none;padding:6px 0;width:100%;text-align:left}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(18px)}
.filters{display:flex;flex-direction:column;gap:14px}
details.fold>summary .muted{white-space:nowrap}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted)}
details.fold[open]>summary::after{content:"−"}
details.fold[open]>summary{margin-bottom:12px}

/* Barra de acciones */
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:25;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.actionbar .inner{max-width:728px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.actionbar .inner .grow{grid-column:1/-1;font-weight:700;padding:0 4px 2px;font-size:14px}
.actionbar .btn.sm{padding-inline:4px}
.actionbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.actionbar .btn.hi{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--ink)}
.tab .pip{display:block;width:18px;height:3px;border-radius:2px;background:transparent;margin-top:1px}
.tab.on .pip{background:var(--hi)}

/* Hojas */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(10,12,14,.42);animation:fade .18s ease}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;max-height:calc(100% - env(safe-area-inset-top,0px) - 14px);display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto;animation:up .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head .grow{flex:1;min-width:0}
.sheet-head h2{overflow-wrap:anywhere}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-foot{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--sunken);display:grid;place-items:center;flex:none;font-size:18px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-wrap{animation:none}}

/* Preguntas */
.q{display:flex;flex-direction:column;gap:12px}
.q .qn{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q .qt{font-size:16.5px;font-weight:700;line-height:1.35}
.q .qt mark{background:linear-gradient(transparent 72%,var(--hi) 72%);color:inherit;padding:0 1px}
.q .samples{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);border-left:3px solid var(--sunken);padding-left:10px}
.q .samples div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .opt{width:100%;justify-content:flex-start;border-radius:12px;padding:10px 12px}
.q .opts{display:flex;flex-direction:column;gap:7px}
.q .opt .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;opacity:.75}
.peek{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.peek .item{padding:9px 12px}

.summary-line{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.summary-line b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Revisión */
.gate{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.gate.alta{background:var(--danger-soft)}
.gate.media{background:var(--warn-soft)}
.gate-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:start;background:var(--surface);border-radius:11px;padding:10px 12px}
.gate-item .why{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.why span{font-size:11.5px;background:var(--sunken);border-radius:6px;padding:2px 7px}
.gate-item .s{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate-item .f{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.incl{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.incl.on{background:var(--danger);border-color:var(--danger);color:#fff}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:700;font-size:14px}
.toast .btn{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}

/* Guía */
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s;font-size:14px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:8px;background:var(--sunken);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.steps li>div{min-width:0}

  importance(m);
  return m;
}

function importance(m) {
  const age = (Date.now() - m.date) / DAY;
  const junk = isJunk(m.type);
  let sc = 0; const r = [];
  const add = (v, txt) => { sc += v; if (txt) r.push(txt); };
  switch (m.type) {
    case 'seg': if (age < 30) add(45, 'Código o alerta de seguridad reciente'); break;
    case 'fin': age < 730 ? add(45, 'Parece de bancos, pagos o facturas') : add(25, 'Parece de bancos, pagos o facturas'); break;
    case 'compra': age < 365 ? add(40, 'Compra del último año: sirve para garantías o devoluciones') : add(age < 730 ? 25 : 15, 'Parece de una compra'); break;
    case 'acad': add(age < 730 ? 40 : 25, 'Parece de la universidad o del trabajo'); break;
    case 'pers': add(50, 'Te lo escribió una persona'); break;
    case 'promo': add(m.lu ? -25 : -15); break;
    case 'news': case 'social': add(-15); break;
    case 'notif': add(-5); break;
  }
  if (m.replied) add(30, 'Tú respondiste en esta conversación');
  if (m.starred) add(40, m.prov === 'microsoft' ? 'Lo marcaste con bandera' : 'Lo marcaste con estrella');
  if (m.gImp && !junk) add(10, m.prov === 'microsoft' ? 'Marcado como de importancia alta' : 'Gmail lo marcó como importante');
  if (m.attach) add(junk ? 5 : 20, 'Tiene archivos adjuntos');
  if (SENS_RE.test(m.dom) && !junk) add(10, 'Viene de una entidad pública o educativa');
  if (age < 10 && !junk) add(10, 'Llegó hace pocos días');
  if (m.deep && !junk) {
    if (m.deep.money) add(10, 'El contenido menciona un valor: ' + m.deep.money);
    if (m.deep.hits.length) add(15, 'El contenido habla de: ' + m.deep.hits.slice(0, 4).join(', '));
    if (m.deep.date) add(5, 'Menciona una fecha límite o vencimiento');
  }
  m.imp = Math.max(0, Math.min(100, sc));
  m.impWhy = r;
  m.lvl = m.imp >= 50 ? 'alta' : m.imp >= 30 ? 'media' : 'baja';
}

function analyzeBody(text) {
  const t = (' ' + norm(text) + ' ').replace(RE.neg, ' ');
  const hits = [...new Set([...kwHits(RE.fin, t), ...kwHits(RE.compra, t), ...kwHits(RE.seg, t), ...kwHits(RE.acad, t)])].slice(0, 6).map(x => pretty(x, text));
  const mm = String(text).match(/\$\s?\d{1,3}(?:[.,]\d{3})+(?:,\d{1,2})?|\bCOP\s?\d[\d.,]{3,}/i);
  const date = /(fecha limite|vence el|vencimiento|antes del|plazo maximo)/.test(t);
  return { hits, money: mm ? mm[0].replace(/\s+/g, ' ') : '', date };
}

async function http(url, opts = {}, tries = 5) {
  for (let i = 0; ; i++) {
    let r;
    try { r = await fetch(url, opts); }
    catch (e) { if (i < tries) { await sleep(700 * (i + 1)); continue; } throw new Error('No hay conexión o el servidor no respondió.'); }
    let rate = r.status === 429 || r.status === 503;
    if (!rate && r.status === 403) { const tx = await r.clone().text().catch(() => ''); rate = /rateLimit|userRateLimit|quota/i.test(tx); }
    if (rate && i < tries) { const ra = +r.headers.get('Retry-After'); await sleep(ra ? ra * 1000 : Math.min(9000, 600 * 2 ** i) + Math.random() * 300); continue; }
    return r;
  }
}
async function apiErr(r, who) {
  let msg = '';
  try { const d = await r.json(); msg = d.error?.message || d.error_description || (typeof d.error === 'string' ? d.error : ''); } catch (e) {}
  if (r.status === 403) return who + ' no dio permiso para esta acción' + (msg ? ': ' + msg : '.');
  return who + ' respondió con un error ' + r.status + (msg ? ': ' + msg : '.');
}

function rebuild() {

    let g = G.get(m.grp);
    if (!g) { g = { key: m.grp, ids: [], names: new Map(), addrs: new Set(), doms: new Set(), accts: new Set(), types: {}, size: 0, unread: 0, first: Infinity, last: 0, lu: null, brand: m.brand, auto: m.auto }; G.set(m.grp, g); }
    g.ids.push(m.id);

    g.addrs.add(m.fromEmail); if (m.dom) g.doms.add(orgDomain(m.dom)); g.accts.add(m.acct);
    g.types[m.type] = (g.types[m.type] || 0) + 1; g.size += m.size || 0; if (m.unread) g.unread++;

function applyLocal(action, acctKey, items) {
  for (const it of items) {
    const id = acctKey + '|' + it.old; const m = S.msgs.get(id); if (!m) continue;
    if (action === 'trash') S.msgs.delete(id);
    else if (action === 'read') m.unread = false;
    else if (action === 'archive' || action === 'label') {
      if (S.opts.scope === 'inbox') S.msgs.delete(id);
      else { m.inbox = false; if (it.now && it.now !== it.old) { S.msgs.delete(id); m.pid = it.now; m.id = acctKey + '|' + it.now; S.msgs.set(m.id, m); } }
    }
  }
}
async function runPlan(plan, onProg) {
  const undo = [], errors = [], notes = [], links = [];
  const total = plan.ops.reduce((a, o) => a + o.ids.length, 0); let done = 0;
  const tick = n => { done += n; onProg(done, total); };
  const touched = new Set();
  for (const u of plan.unsub || []) {
    const m = S.msgs.get(u.msgId) || u.snap; if (!m) continue;
    const r = await unsubscribe(m);
    if (r.ok) notes.push(u.name + ': ' + r.text); else if (r.link) links.push({ name: u.name, link: r.link, text: r.text }); else notes.push(u.name + ': ' + r.text);
  }
  for (const op of plan.ops) {
    if (!op.ids.length) continue;
    for (const [ak, ids] of groupBy(op.ids, id => S.msgs.get(id)?.acct)) {
      const acct = acctOf(ak); if (!acct) continue;
      const P = provOf(acct); const msgs = ids.map(id => S.msgs.get(id)).filter(Boolean); const pids = msgs.map(m => m.pid);
      try {
        const res = op.action === 'trash' ? await P.trash(acct, pids, tick) : op.action === 'archive' ? await P.archive(acct, pids, tick) : op.action === 'label' ? await P.label(acct, pids, op.label, tick) : await P.markRead(acct, pids, tick);
        const items = []; let failed = 0;
        res.forEach((r, i) => { if (r.err) failed++; else items.push({ old: r.old, now: r.now, snap: { ...msgs[i] } }); });
        applyLocal(op.action, ak, items);
        undo.push({ action: op.action, label: op.label, acct: ak, items });
        touched.add(ak);
        if (failed) errors.push(fmtN(failed) + ' correos de ' + acct.email + ' no se pudieron procesar.');
      } catch (e) {
        if (e.auth) { acct.expired = true; errors.push('La sesión de ' + acct.email + ' venció. Reconéctala (arriba) y vuelve a intentarlo.'); }
        else errors.push(acct.email + ': ' + e.message);
      }
    }
  }
  for (const rule of plan.rules || []) {
    for (const ak of rule.accts) {
      const acct = acctOf(ak); if (!acct) continue;
      try { await provOf(acct).createRule(acct, rule); if (acct.prov !== 'demo') S.rules.push({ name: rule.name, desc: ruleDesc(rule), email: acct.email, at: Date.now() }); notes.push('Regla creada en ' + acct.email + ': ' + ruleDesc(rule) + (acct.prov === 'demo' ? ' (ejemplo)' : '') + '.'); }
      catch (e) { errors.push('No se pudo crear la regla en ' + acct.email + ': ' + (e.auth ? 'la sesión venció.' : e.message)); }
    }
    if (!S.demo) LS.set('rules', S.rules);
  }
  for (const ak of touched) await persistAcct(ak);
  rebuild();
  return { undo, errors, notes, links };
}
async function undoLast() {
  const u = S.lastUndo; if (!u) return;
  S.lastUndo = null; hideToast(); showToast('Deshaciendo…');
  let n = 0;
  for (const rec of u.undo) {
    const acct = acctOf(rec.acct); if (!acct || !rec.items.length) continue;
    const P = provOf(acct);
    try {
      const fn = { trash: 'untrash', archive: 'unarchive', label: 'unlabel', read: 'markUnread' }[rec.action];
      const nows = await P[fn](acct, rec.items, rec.label);
      rec.items.forEach((it, i) => {
        S.msgs.delete(rec.acct + '|' + it.now);
        const m = { ...it.snap, pid: nows[i] || it.now }; m.id = rec.acct + '|' + m.pid;
        S.msgs.set(m.id, m); n++;
      });
      await persistAcct(rec.acct);
    } catch (e) { showFlash('No se pudo deshacer en ' + acct.email + ': ' + (e.auth ? 'la sesión venció.' : e.message)); }

  showToast(fmtN(n) + ' ' + plural(n, 'correo restaurado', 'correos restaurados') + '.');
}
function parseLU(lu) {
  const out = []; (String(lu).match(/<([^>]+)>/g) || []).forEach(x => out.push(x.slice(1, -1).trim()));
  if (!out.length) String(lu).split(/[,\s]+/).forEach(x => { if (/^(https?:|mailto:)/i.test(x)) out.push(x); });
  return { http: out.find(u => /^https:/i.test(u)) || out.find(u => /^http:/i.test(u)), mailto: out.find(u => /^mailto:/i.test(u)) };
}

function suggestions(msgs) {
  const now = Date.now();
  return SUGG.map(d => {
    const ids = msgs.filter(m => d.f(m, (now - m.date) / DAY)).map(m => m.id);
    const senders = new Set(ids.map(id => S.msgs.get(id).grp)).size;
    const size = ids.reduce((a, id) => a + (S.msgs.get(id).size || 0), 0);
    return { ...d, ids, senders, size };
  }).filter(d => d.ids.length);
}

function similarTo(m) {

  const sim = sameType.filter(id => id === m.id || jacc(tk, subjTokens(S.msgs.get(id).subject)) >= 0.3);
  return { g, sim, sameType };
}
function sheetSimilar(s) {

/* revisión */
function openReview(plan) {
  S.rv = { title: plan.title, ops: plan.ops, rules: plan.rules || [], unsub: plan.unsub || [], stage: 'scan', inc: new Set(), exc: new Set(), deep: { done: 0, total: 0 }, prog: { done: 0, total: 0 }, result: null };
  pushSheet({ kind: 'review' });
  const trash = [...new Set(plan.ops.filter(o => o.action === 'trash').flatMap(o => o.ids))];
  const cand = trash.filter(id => { const m = S.msgs.get(id); return m && m.lvl !== 'baja' && !m.deep; }).slice(0, 40);
  if (!cand.length) { S.rv.stage = 'review'; renderSheets(); return; }
  S.rv.deep.total = cand.length; renderSheets();
  let last = 0;
  deepReadMany(cand, (d, t) => { S.rv.deep.done = d; if (Date.now() - last > 120) { last = Date.now(); renderSheets(); } })
    .catch(e => { if (e.auth) { e.acct.expired = true; renderTop(); } })
    .finally(() => { if (S.rv) { S.rv.stage = 'review'; renderSheets(); } });
}
function rvSets() {
  const rv = S.rv;
  const trash = [...new Set(rv.ops.filter(o => o.action === 'trash').flatMap(o => o.ids))].filter(id => S.msgs.has(id));
  const alta = trash.filter(id => S.msgs.get(id).lvl === 'alta').sort((a, b) => S.msgs.get(b).imp - S.msgs.get(a).imp);
  const media = trash.filter(id => S.msgs.get(id).lvl === 'media');
  const final = trash.filter(id => S.msgs.get(id).lvl === 'alta' ? rv.inc.has(id) : !rv.exc.has(id));
  return { trash, alta, media, final };
}
function finalOps() {
  const { final } = rvSets(); const fs = new Set(final);
  return S.rv.ops.map(o => o.action === 'trash' ? { ...o, ids: o.ids.filter(id => fs.has(id)) } : { ...o, ids: o.ids.filter(id => S.msgs.has(id)) }).filter(o => o.ids.length);
}

  const lines = [];

  const merged = []; for (const l of lines) { const x = merged.find(y => y[0] === l[0]); if (x) x[1] += l[1]; else merged.push([...l]); }
  const nothing = !ops.length && !rv.rules.length && !rv.unsub.length;

async function runReview() {
  const rv = S.rv; const ops = finalOps();
  rv.stage = 'running'; rv.prog = { done: 0, total: ops.reduce((a, o) => a + o.ids.length, 0) }; renderSheets();
  let last = 0;
  const snaps = rv.unsub.map(u => ({ ...u, snap: S.msgs.get(u.msgId) }));
  const res = await runPlan({ ops, rules: rv.rules, unsub: snaps }, (d, t) => { rv.prog.done = d; if (Date.now() - last > 120) { last = Date.now(); renderSheets(); } });
  const lines = [];
  for (const u of res.undo) { const lbl = u.action === 'trash' ? 'En la papelera' : u.action === 'label' ? 'En “' + u.label + '”' : u.action === 'archive' ? 'Archivados' : 'Marcados como leídos'; const x = lines.find(l => l[0] === lbl); if (x) x[1] += u.items.length; else lines.push([lbl, u.items.length]); }

async function handleReturn() {
  const h = location.hash.slice(1); if (!h) return null;
  const p = new URLSearchParams(h);
  if (!p.has('state')) return null;
  history.replaceState(null, '', location.pathname + location.search);
  const saved = LS.get('oauth'); LS.del('oauth');
  if (!saved || saved.st !== p.get('state')) { S.flash = 'La respuesta de inicio de sesión no coincide con la solicitud. Intenta conectar de nuevo.'; return null; }
  try {
    const info = saved.prov === 'google' ? await Google.finish(p, saved) : await Microsoft.finish(p, saved);
    let acct = S.accounts.find(a => a.key === info.key);
    const isNew = !acct;
    if (!acct) { acct = { ...info, addedAt: Date.now() }; S.accounts.push(acct); }
    acct.expired = false; saveAccounts();
    return { acct, isNew };
  } catch (e) { S.flash = e.message; return null; }
}
async function init() {

  if (ret) {
    const has = [...S.msgs.values()].some(m => m.acct === ret.acct.key);
